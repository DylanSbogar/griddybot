name: Deploy

on:
  push:
    branches: [ release/slop ]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Stop app
        run: sudo systemctl stop griddybot || true

      - name: Deploy jar
        run: cp target/*.jar /opt/griddybot/griddybot.jar

      - name: Start app
        run: sudo systemctl start griddybot

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          jq -n \
            --arg content "**Deployment failed** and it's $ACTOR's fault
          Commit: $COMMIT_MSG
          $RUN_URL" \
            '{content: $content}' \
          | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"
